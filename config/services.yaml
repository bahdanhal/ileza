parameters:
  env(CONTACT_LEAD_DIRECTORY): '/app/var/contact-leads'
  env(MARKET_DATA_DIRECTORY): '/app/var/market-data'
  env(ANALYTICS_DATA_DIRECTORY): '/app/var/analytics-data'
  env(ANALYTICS_RETENTION_DAYS): '90'
  env(MARKET_ADMIN_TOKEN): ''
  env(SMTP_HOST): ''
  env(SMTP_PORT): '587'
  env(SMTP_USERNAME): ''
  env(SMTP_PASSWORD): ''
  env(SMTP_ENCRYPTION): 'tls'
  env(MAILER_SENDER_EMAIL): 'powiadomienia@ileza.pl'
  env(MAILER_SENDER_NAME): 'IleZa.pl'
  contact.lead_directory: '%env(CONTACT_LEAD_DIRECTORY)%'
  market.data_directory: '%env(MARKET_DATA_DIRECTORY)%'
  analytics.data_directory: '%env(ANALYTICS_DATA_DIRECTORY)%'
  analytics.retention_days: '%env(int:ANALYTICS_RETENTION_DAYS)%'
  smtp.host: '%env(SMTP_HOST)%'
  smtp.port: '%env(int:SMTP_PORT)%'
  smtp.username: '%env(SMTP_USERNAME)%'
  smtp.password: '%env(SMTP_PASSWORD)%'
  smtp.encryption: '%env(SMTP_ENCRYPTION)%'
  mailer.sender_email: '%env(MAILER_SENDER_EMAIL)%'
  mailer.sender_name: '%env(MAILER_SENDER_NAME)%'

services:
  _defaults:
    autowire: true
    autoconfigure: true

  App\:
    resource: '../src/'
    exclude: '../src/{DependencyInjection,Entity,Kernel.php}'

  Bahdan\SafeHttpClient\UrlGuard:
    alias: App\Shared\Infrastructure\Http\UrlGuard

  Bahdan\SafeHttpClient\SafeHttpFetcher:
    alias: App\Shared\Infrastructure\Http\SafeHttpFetcher

  App\Lead\Domain\LeadRepository:
    alias: App\Lead\Infrastructure\DoctrineLeadRepository

  Bahdan\LeadCaptureBundle\Domain\LeadRepository:
    alias: App\Lead\Infrastructure\DoctrineLeadRepository

  App\Lead\Infrastructure\JsonlLeadRepository:
    arguments:
      $directory: '%contact.lead_directory%'

  App\Lead\Application\CaptureLead:
    arguments:
      $secret: '%env(APP_SECRET)%'

  Bahdan\LeadCaptureBundle\Application\CaptureLead:
    alias: App\Lead\Application\CaptureLead

  App\Analytics\Domain\PageViewRepository:
    alias: App\Analytics\Infrastructure\DoctrinePageViewRepository

  Bahdan\PrivacyAnalyticsBundle\Domain\PageViewRepository:
    alias: App\Analytics\Infrastructure\DoctrinePageViewRepository

  Bahdan\PrivacyAnalyticsBundle\Application\TrafficAnalytics:
    alias: App\Analytics\Application\TrafficAnalytics

  App\Analytics\Infrastructure\DoctrinePageViewRepository:
    arguments:
      $retentionDays: '%analytics.retention_days%'

  App\Analytics\Infrastructure\JsonlPageViewRepository:
    arguments:
      $directory: '%analytics.data_directory%'
      $retentionDays: '%analytics.retention_days%'

  App\Analytics\Infrastructure\PageViewSubscriber:
    arguments:
      $secret: '%env(APP_SECRET)%'

  App\Mcp\AdminAccess:
    arguments:
      $token: '%env(MARKET_ADMIN_TOKEN)%'

  App\Market\Domain\ProductRepository:
    alias: App\Market\Infrastructure\DoctrineProductRepository

  App\Market\Domain\PriceObservationRepository:
    alias: App\Market\Infrastructure\DoctrinePriceObservationRepository

  App\Market\Domain\ProductRequestStore:
    alias: App\Market\Infrastructure\DoctrineProductRequestStore

  App\Market\Domain\PriceTipRepository:
    alias: App\Market\Infrastructure\DoctrinePriceTipRepository

  App\Market\Infrastructure\DoctrineProductRequestStore:
    arguments:
      $secret: '%env(APP_SECRET)%'

  App\Market\Infrastructure\DoctrinePriceTipRepository:
    arguments:
      $secret: '%env(APP_SECRET)%'

  App\Market\Infrastructure\JsonPriceObservationRepository:
    arguments:
      $directory: '%market.data_directory%'

  App\Market\Infrastructure\JsonProductRequestStore:
    arguments:
      $directory: '%market.data_directory%'
      $secret: '%env(APP_SECRET)%'

  App\Market\Infrastructure\JsonPriceTipRepository:
    arguments:
      $directory: '%market.data_directory%'
      $secret: '%env(APP_SECRET)%'

  App\Command\MigrateStorageToDatabaseCommand:
    arguments:
      $marketDataDirectory: '%market.data_directory%'
      $contactLeadDirectory: '%contact.lead_directory%'
      $analyticsDataDirectory: '%analytics.data_directory%'

  App\Market\Domain\PriceAlertRepository:
    alias: App\Market\Infrastructure\DoctrinePriceAlertRepository

  App\Market\Application\PriceAlertMailerInterface:
    alias: App\Market\Infrastructure\Mail\TransactionalPriceAlertMailer

  App\Market\Infrastructure\DoctrinePriceAlertRepository:
    arguments:
      $secret: '%env(APP_SECRET)%'

  App\Market\Infrastructure\Mail\SmtpTransportInterface:
    alias: App\Market\Infrastructure\Mail\SmtpTransport

  App\Market\Infrastructure\Mail\SmtpTransport:
    arguments:
      $host: '%smtp.host%'
      $port: '%smtp.port%'
      $username: '%smtp.username%'
      $password: '%smtp.password%'
      $encryption: '%smtp.encryption%'

  App\Market\Infrastructure\Mail\TransactionalPriceAlertMailer:
    arguments:
      $senderEmail: '%mailer.sender_email%'
      $senderName: '%mailer.sender_name%'
      $logDirectory: '%contact.lead_directory%'
      $smtpTransport: '@App\Market\Infrastructure\Mail\SmtpTransport'

  App\Controller\MarketController:
    arguments:
      $productRequestLimiter: '@limiter.product_request'
      $priceTipLimiter: '@limiter.price_tip'
      $priceAlertLimiter: '@limiter.price_alert'

  App\Controller\Admin\MarketAdminController:
    arguments:
      $secret: '%env(APP_SECRET)%'
      $projectDir: '%kernel.project_dir%'

  App\Twig\AdminCsrfExtension:
    arguments:
      $secret: '%env(APP_SECRET)%'
    tags: ['twig.extension']

  app.rate_limit_cache:
    class: Symfony\Component\Cache\Adapter\FilesystemAdapter
    arguments:
      $namespace: 'ileza-rate-limits-v1'
      $defaultLifetime: 172800
      $directory: '/app/var/rate-limits'

  App\Mcp\Http\McpControllerDecorator:
    decorates: mcp.server.controller
    arguments:
      $inner: '@.inner'
      $sessionStore: '@mcp.session.store'
    public: true
    tags:
      - { name: controller.service_arguments }
