mcp:
  servers:
    default:
      name: 'IleZa.pl Fair Prices & Tax MCP'
      version: '2.1.0'
      description: 'Bahdan Hal’s personal price estimates and dated estimate histories for products in Poland, plus a Polish net salary and tax calculator.'
      website_url: 'https://ileza.pl/'
      instructions: |
        Public tools provide Bahdan Hal’s personal price estimates with dated histories and Polish net salary calculations. Each price is his personal opinion on what he would pay on the stated date, with no single fixed methodology. Public tools need no authentication.
      transports:
        http: true
        stdio: true
      http:
        path: '/mcp'
        allowed_hosts: ['ileza.pl', 'www.ileza.pl', 'localhost', '127.0.0.1']
      session:
        store: file
        directory: '%kernel.project_dir%/var/mcp-sessions'
        ttl: 3600
      registry: '*'
