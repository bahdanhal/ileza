mcp:
  servers:
    default:
      name: 'IleZa.pl Fair Prices & Tax MCP'
      version: '2.1.0'
      description: 'Manual editorial fair prices and dated fair-price histories for products in any category in Poland, plus a Polish net salary and tax calculator.'
      website_url: 'https://ileza.pl/'
      instructions: |
        Public tools provide manual editorial fair-price histories and Polish net salary calculations. Price estimates are subjective editorial judgments, not statistical samples or algorithmic valuations. Public tools need no authentication.
      transports:
        http: true
        stdio: true
      http:
        path: '/mcp'
        allowed_hosts: ['ileza.pl', 'www.ileza.pl', 'localhost', '127.0.0.1']
      session:
        store: file
        directory: '%kernel.project_dir%/var/mcp-sessions'
        ttl: 3600
      registry: '*'
