mcp:
  app: 'IleZa.pl Price Radar & Tax MCP'
  version: '1.1.0'
  description: 'Polish used electronics price radar and net salary/tax calculator, plus Bearer-protected price observations and market statistics.'
  website_url: 'https://ileza.pl/'
  instructions: |
    Public tools provide Polish used-goods price indices, historical trends, and Polish net salary calculations. Administrative tools require an Authorization: Bearer header.
  client_transports:
    http: true
    stdio: true
  http:
    path: '/mcp'
    allowed_hosts: ['ileza.pl', 'www.ileza.pl', 'localhost', '127.0.0.1']
    session:
      store: file
      directory: '%kernel.project_dir%/var/mcp-sessions'
      ttl: 3600
