        text: "To porównanie planistyczne, a nie program kadrowo-płacowy. Zakłada tę samą kwotę przez 12 miesięcy i stosuje skalę oraz typowe składki z 2026 r."
        one: "UoP obejmuje składki pracownika i szacowane obciążenia pracodawcy przy składce wypadkowej 1,67%; KUP pracownika to 250 zł/mies."
        two: "UZ zakłada pełne oskładkowanie z dobrowolnym chorobowym, chyba że zaznaczysz studenta do 26 lat; uwzględniamy roczny limit ulgi dla młodych. UoD stosuje 20% KUP bez ZUS i składki zdrowotnej."
        three: "B2B pomija VAT jako zwykle neutralny, używa wybranego ZUS i podatku oraz nie modeluje urlopu, księgowości, każdej ulgi i rozliczenia rocznego."
        four: "Spółka z o.o. modeluje wynagrodzenie członka zarządu z powołania (uchwała wspólników): brak składek na ubezpieczenia społeczne, składka zdrowotna 9%, skala podatkowa 12%/32% oraz koszty stałe prowadzenia spółki."
    sources:
        title: "Oficjalne źródła 2026"
        text: "Parametry wynikają z aktualnych informacji polskiego rządu i ZUS, sprawdzonych w dniu podanym wyżej."
        health: "składka zdrowotna"
        business: "zdrowotna przedsiębiorcy"
    limitations:
        title: "Sytuacje zmieniające wynik"
        text: "Inne dochody, wspólne rozliczenie, ulga dla młodych, autorskie KUP, PPK, zbieg tytułów, niepełnosprawność, dokładna wypadkowa, roczne rozliczenie zdrowotnej, urlop i właściwa stawka ryczałtu mogą istotnie zmienić wynik."
        disclaimer: "Wyłącznie szacunek informacyjny. Rzeczywistą umowę sprawdź w programie kadrowo-księgowym lub u polskiego specjalisty."
    faq:
        title: "Często zadawane pytania o formy zatrudnienia w Polsce"
        q1: "Czym różnią się formy UoP, UZ, UoD, B2B i Spółka z o.o.?"
        a1: "Umowa o pracę (UoP) zapewnia pełne prawa pracownicze i płatny urlop. Umowa zlecenie (UZ) to elastyczna umowa cywilnoprawna ze składkami społecznymi (zwolniona dla studentów do 26 lat). Umowa o dzieło (UoD) dotyczy wykonania określonego dzieła i nie podlega ubezpieczeniom społecznym ani zdrowotnemu. B2B to jednoosobowa działalność gospodarcza z bezpośrednim fakturowaniem. Spółka z o.o. (powołanie członka zarządu) pozwala na wypłatę bez składek na ubezpieczenia społeczne, ze składką zdrowotną 9% i podatkiem dochodowym według skali."
        q2: "Dlaczego porównanie wychodzi od budżetu firmy lub przelicza brutto UoP?"
        a2: "Punktem wyjścia jest łączny koszt, jaki zleceniodawca lub pracodawca przeznacza na stanowisko (Budżet = Brutto UoP × 1.2048). Pozwala to na rzetelne i przejrzyste porównanie kwoty na rękę przy identycznym nakładzie finansowym."
        q3: "Jak działa składka zdrowotna na B2B w 2026 roku?"
        a3: "Na skali podatkowej wynosi 9% dochodu, na podatku liniowym 4.9% dochodu, a na ryczałcie jest zryczałtowaną kwotą zależną od rocznego przedziału przychodów."

