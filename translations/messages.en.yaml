income:
    meta:
        title: "Poland Salary & Contract Calculator 2026 · UoP, UZ, UoD, B2B and Sp. z o.o."
        description: "Compare Polish take-home net income from the same employer budget or gross pay for Umowa o Pracę (UoP), Umowa Zlecenie (UZ), Umowa o Dzieło (UoD), B2B, and Sp. z o.o. board resolution under 2026 tax and ZUS rules."
    eyebrow: "Poland · Contracts · 2026"
    heading: "UoP / UZ / UoD / B2B / Sp. z o.o. calculator"
    lede: "Compare what reaches you from the same monthly company budget or UoP gross salary. See gross amount, social and health contributions, PIT, business costs, and estimated take-home pay side by side."
    verified: "Rules checked"
    types:
        employment: "Umowa o pracę"
        mandate: "Umowa zlecenie"
        work: "Umowa o dzieło"
        b2b: "B2B"
        spolka: "Spółka z o.o. (Board Resolution)"
    form:
        base_title: "Starting point for comparison"
        base_subtitle: "Enter the total employer budget or UoP gross salary — both fields are linked and recalculate each other in real time."
        budget: "Company budget (Total employer cost)"
        budget_help: "Total monthly employer/client budget allocated for the position."
        uop_gross: "Gross salary (UoP employment)"
        uop_gross_help: "Gross employment contract salary. Derived from company budget (÷ 1.2048)."
        sync_tooltip: "Linked fields: entering a value in either field automatically updates the other"
        options_title: "Contract-specific options"
        options_help: "Customize only the parameters you want to adjust for a given contract. Other contracts calculate automatically using standard defaults."
        uop_badge: "UoP"
        uop_title: "Employment contract (UoP)"
        uop_help: "Options applying solely to the employment contract calculation"
        uop_under26: "Employee under 26 (youth tax relief)"
        uop_under26_help: "PIT income tax exemption up to 85,528 PLN per year. Social and health contributions remain mandatory."
        b2b_badge: "B2B"
        b2b_title: "Sole proprietorship (B2B)"
        b2b_help: "Settings applying solely to the B2B calculation"
        uz_badge: "UZ"
        uz_title: "Mandate contract (UZ)"
        uz_help: "Options applying solely to the mandate contract calculation"
        llc_badge: "LLC"
        llc_title: "Spółka z o.o. (Board Resolution)"
        llc_help: "Parameters applying solely to the Sp. z o.o. calculation"
        student: "Student / pupil under 26"
        student_help: "Exemption from ZUS (social and health) and zero-rate PIT for youth up to 85,528 PLN/year (gross = net)."
        costs: "Monthly B2B business costs"
        costs_help: "Accounting, hardware, office, etc. (deductible from taxable base and health contribution)."
        taxation: "B2B taxation"
        zus: "Social ZUS contributions"
        lump_rate: "Lump-sum rate"
        llc_costs: "Monthly LLC operating overhead"
        llc_costs_help: "Fixed running costs (full bookkeeping, bank account, registered office)."
        llc_note: "Board member resolution: 0 PLN social ZUS, 9% health contribution, progressive tax scale (12% / 32%)."
        statutory_notice: "Umowa o dzieło (UoD) follows statutory rules (20% deductible expenses, no social or health contributions). Standard UoP employee costs are 250 PLN/mo."
    taxation:
        linear: "Linear PIT 19%"
        scale: "Tax scale 12% / 32%"
        lump: "Lump sum on revenue"
    zus:
        standard: "Standard ZUS 2026"
        preferential: "Preferential ZUS"
        start: "Ulga na start"
    result:
        net: "estimated take-home / month"
        budget: "Company budget"
        gross: "Gross / revenue"
        costs: "Business costs"
        social: "Social contributions"
        health: "Health contribution"
        tax: "PIT"
    assumptions:
        title: "Comparable assumptions"
        text: "This is an informational comparison, not payroll software. It annualizes one unchanged monthly amount and applies the 2026 tax scale and common contribution rules."
        one: "UoP includes employee contributions and an estimated employer burden using a 1.67% accident rate; employee costs are 250 PLN/month."
        two: "UZ assumes full social insurance including voluntary sickness unless the under-26 student option is selected; the annual youth-relief limit is included. UoD uses 20% deductible costs and no social or health contributions."
        three: "B2B excludes VAT as normally neutral, assumes the selected ZUS/tax regime, and does not model holidays, accounting fees or every relief and annual adjustment."
        four: "Spółka z o.o. models remuneration under a board member resolution (uchwała wspólników): 0 PLN social ZUS, 9% health contribution, 12%/32% progressive tax scale, and company operating overhead."
    sources:
        title: "Official 2026 references"
        text: "Parameters are based on official gov.pl and ZUS guidance checked on the date above."
        health: "health contribution"
        business: "business health rules"
    limitations:
        title: "Situations that change the result"
        text: "Other income, joint filing, age relief, copyright costs, PPK, multiple insurance titles, disability, exact accident rate, annual health reconciliation, holidays and industry-specific lump-sum rates can materially change the result."
        disclaimer: "Informational estimate only. Consult an accountant or tax advisor for exact contract calculations and terms."
    faq:
        title: "Frequently Asked Questions about Polish Employment Contracts"
        q1: "What is the difference between UoP, UZ, UoD, B2B, and Spółka z o.o.?"
        a1: "Umowa o pracę (UoP) provides standard labour code protections and paid leave with full social security. Umowa zlecenie (UZ) is a civil services contract with social and health contributions (exempt for students under 26). Umowa o dzieło (UoD) is a task/result contract without social or health contributions. B2B is a sole proprietorship contract where you invoice clients directly. Spółka z o.o. (board member resolution) allows remuneration without social-insurance contributions, subject to a 9% health contribution and progressive income tax."
        q2: "Why does the comparison start from company budget or convert UoP gross?"
        a2: "Comparing from the employer's total budget (Total Cost = UoP Gross × 1.2048) provides an honest apples-to-apples comparison of what a business spends versus what lands in your personal bank account across all contract forms."
        q3: "How does the health contribution (składka zdrowotna) differ on B2B?"
        a3: "On tax scale (skala) it is 9% of income. On linear PIT (liniowy) it is 4.9% of income. On lump-sum (ryczałt) it is a fixed monthly tier based on annual revenue."
