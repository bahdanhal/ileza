name: CI & Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Verification & Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Test Image
        run: docker buildx build --load --target test --tag ileza-test --cache-from type=gha --cache-to type=gha,mode=max .

      - name: Run PHPUnit Test Suite
        run: docker run --rm --env-file .env.example -e APP_ENV=test ileza-test vendor/bin/phpunit --fail-on-phpunit-notice

      - name: Run JavaScript Test Suites
        run: docker run --rm -v "$PWD:/app" -w /app node:24-alpine sh -lc 'for test in tests/js/*.test.js; do node "$test" || exit 1; done'

      - name: Run PSR-12 Code Style Check
        run: docker run --rm ileza-test vendor/bin/phpcs

      - name: Run PHPStan Static Analysis
        run: docker run --rm ileza-test vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Lint Twig Templates
        run: docker run --rm ileza-test php bin/console lint:twig templates

      - name: Lint YAML Configuration
        run: docker run --rm ileza-test php bin/console lint:yaml translations config

      - name: Validate Composer Config
        run: docker run --rm ileza-test composer validate --strict --no-check-publish

      - name: Security Audit Dependencies
        run: docker run --rm ileza-test composer audit --locked --no-interaction
