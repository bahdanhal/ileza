name: Deploy IleZa to Production

on:
  push:
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: production-ileza
  cancel-in-progress: false

jobs:
  test:
    name: Verification Gate
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Deploy to Server
    needs: test
    runs-on: ubuntu-latest
    environment: production
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server Host Key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Rsync Files to Production Server
        run: |
          rsync -az --delete \
            --exclude='.git*' \
            --exclude='.idea' \
            --exclude='.agents' \
            --exclude='production.env' \
            --exclude='.env.local' \
            --exclude='var/' \
            --exclude='vendor/' \
            ./ "$SSH_USER@$SSH_HOST:/home/apps/ileza/"

      - name: Rebuild & Restart IleZa Container
        run: |
          ssh "$SSH_USER@$SSH_HOST" \
            'cd /home/apps/infra && docker compose -f docker-compose.prod.yml --env-file production.env up -d --build --no-deps ileza-app'

      - name: Health Check
        run: |
          sleep 5
          curl -f -I --retry 3 --retry-delay 2 https://ileza.pl/ || exit 1
